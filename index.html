<style>
:root{--ink:#111827;--muted:#64748b;--line:#dbe3ea;--accent:#0f766e;--accent2:#115e59;--bg:#eef3f7;--page-w:297mm;--page-h:210mm}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea{font:inherit}.app{width:100vw;height:100vh;display:grid;grid-template-columns:350px minmax(0,1fr);overflow:hidden}.panel{height:100vh;overflow:hidden;background:#fff;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}.brand{display:flex;align-items:center;gap:10px;min-height:48px}.brand img{width:46px;height:46px;border-radius:12px;border:1px solid #cbd5e1;box-shadow:0 4px 14px rgba(15,118,110,.12)}.brand h1{font-size:18px;line-height:1.12;margin:0}.brand p{font-size:10.5px;color:var(--muted);margin:3px 0 0}.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;box-shadow:0 3px 10px rgba(15,23,42,.035)}.card h2{font-size:12.5px;margin:0 0 6px}.type-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px}.type-btn{border:1px solid #cbd5e1;background:#f8fafc;color:#334155;border-radius:8px;min-height:31px;padding:5px 6px;font-size:10.5px;font-weight:800;cursor:pointer}.type-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(15,118,110,.15)}.field{margin-top:6px}.field:first-of-type{margin-top:0}label{display:block;font-size:10.5px;font-weight:800;margin-bottom:3px}input[type=text],input[type=tel],textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#111827;outline:none;padding:6px 8px;font-size:12.5px}textarea{height:48px;resize:none;line-height:1.2}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.10)}.font-control{margin-top:4px;border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:4px 6px}.font-head{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:#475569;margin-bottom:1px}.font-head b{font-size:9.5px;color:#0f172a}.font-row{display:grid;grid-template-columns:28px 1fr 28px;gap:5px;align-items:center}.font-row input{width:100%;height:22px;margin:0;accent-color:var(--accent)}.mini{height:24px;padding:0;border-radius:6px;background:#fff;border:1px solid #cbd5e1;color:#111827;font-weight:800;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.btn{border:0;border-radius:8px;min-height:34px;padding:7px 8px;font-size:10.5px;font-weight:800;cursor:pointer;transition:.12s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.btn[hidden]{display:none!important}.dark{background:#111827;color:#fff}.green{background:var(--accent);color:#fff}.soft{background:#e8f7f5;color:#0f766e;border:1px solid #b8e5de}.ghost{background:#f3f4f6;color:#111827;border:1px solid #e5e7eb}.status{min-height:14px;margin-top:5px;font-size:9.5px;line-height:1.25;color:var(--accent2)}.footer{margin-top:auto;padding:7px 8px;text-align:center;font-size:9.7px;line-height:1.35;border:1px solid var(--line);border-radius:10px;background:#fbfdfd}.footer a{color:#0f766e;text-decoration:none;font-weight:800}.workspace{height:100vh;min-width:0;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column}.preview-shell{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}.preview-stage{position:relative;width:var(--page-w);height:var(--page-h);flex:0 0 auto;transform:translate(var(--pan-x,0px),var(--pan-y,0px)) scale(var(--scale,1));transform-origin:center center;will-change:transform}.preview-shell.pan-ready{cursor:grab}.preview-shell.panning{cursor:grabbing}.preview-shell.panning *{cursor:grabbing!important;user-select:none!important}.a4{position:absolute;inset:0;width:var(--page-w);height:var(--page-h);background:#fff;display:grid;place-items:center;box-shadow:0 12px 34px rgba(15,23,42,.18)}.label-grid{display:grid;gap:1mm}.drug-label{position:relative;overflow:hidden;background:#fff;color:#000;font-family:"Times New Roman",Times,serif;--name-fs:2.62mm;--address-fs:2.42mm;--phone-fs:3mm}.template{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0;pointer-events:none}.head-name,.head-address,.head-phone{position:absolute;left:1.2mm;right:1.2mm;text-align:center;overflow:hidden;z-index:1}.head-name{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--name-fs);line-height:1.03;text-transform:uppercase;white-space:nowrap}.head-address{display:flex;align-items:flex-start;justify-content:center;font-weight:700;font-size:var(--address-fs);line-height:1.11;text-transform:uppercase;padding:0 .3mm;white-space:normal;overflow-wrap:anywhere}.head-phone{display:flex;align-items:center;justify-content:center;color:#ef1111;font-size:var(--phone-fs);line-height:1;white-space:nowrap}.drug-label.cold-label .head-address{align-items:flex-end}.preview-shell{overscroll-behavior:contain;touch-action:none}
@media(max-height:760px) and (min-width:901px){.panel{padding:8px 10px;gap:5px}.brand{min-height:40px}.brand img{width:38px;height:38px}.brand h1{font-size:16px}.brand p{font-size:9.5px}.card{padding:7px 8px}.type-switch{margin-bottom:5px}.type-btn{min-height:27px;font-size:9.7px}.field{margin-top:4px}input[type=text],input[type=tel]{padding:5px 7px}textarea{height:40px}.font-control{margin-top:3px;padding:3px 5px}.actions{margin-top:5px;gap:4px}.btn{min-height:29px;padding:5px 6px;font-size:9.8px}.footer{padding:5px 7px;font-size:9px}.workspace{padding:8px 10px}}
@media(max-width:900px){html,body{height:auto;overflow:auto}.app{display:block;height:auto;overflow:visible}.panel{height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}.workspace{height:70vh;min-height:520px}.footer{margin-top:8px}}
@media print{html,body{width:var(--page-w)!important;height:var(--page-h)!important;background:#fff!important;overflow:visible!important}.panel{display:none!important}.app,.workspace,.preview-shell,.preview-stage{display:block!important;width:var(--page-w)!important;height:var(--page-h)!important;padding:0!important;margin:0!important;overflow:visible!important;transform:none!important}.a4{box-shadow:none!important}.template{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}

const $=s=>document.querySelector(s);
const els={name:$('#storeName'),address:$('#address'),phone:$('#phone'),nameSize:$('#nameSize'),addressSize:$('#addressSize'),phoneSize:$('#phoneSize'),grid:$('#labelGrid'),status:$('#status'),install:$('#installBtn'),update:$('#updateBtn'),stage:$('#previewStage'),shell:$('#previewShell'),brandSub:$('#brandSub'),sheet:$('#sheet')};
let currentType=localStorage.getItem('nhan-label-type')||'regular'; if(!TYPES[currentType]) currentType='regular';
let deferredPrompt=null,swRegistration=null,refreshing=false;
const imgRegular=new Image(),imgCold=new Image();imgRegular.src=TEMPLATE_REGULAR;imgCold.src=TEMPLATE_COLD;
function cfg(){return TYPES[currentType]}
function currentImg(){return currentType==='cold'?imgCold:imgRegular}
function setStatus(msg){els.status.textContent=msg||''}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
function data(){return{name:clean(els.name.value).toUpperCase(),address:clean(els.address.value).toUpperCase(),phone:clean(els.phone.value),sizes:{name:+els.nameSize.value,address:+els.addressSize.value,phone:+els.phoneSize.value}}}
function labelHTML(d){const c=cfg(),n=esc(d.name),a=d.address?esc('ĐỊA CHỈ: '+d.address):'',p=d.phone?esc('SĐT : '+d.phone):'';return `<div class="drug-label ${c.key==='cold'?'cold-label':''}" style="width:${c.w}mm;height:${c.h}mm;--name-fs:${d.sizes.name}mm;--address-fs:${d.sizes.address}mm;--phone-fs:${d.sizes.phone}mm"><img class="template" src="${c.template}" alt=""><div class="head-name" style="top:${c.nameTop}mm;height:${c.nameH}mm">${n}</div><div class="head-address" style="top:${c.addressTop}mm;height:${c.addressH}mm">${a}</div><div class="head-phone" style="top:${c.phoneTop}mm;height:${c.phoneH}mm">${p}</div></div>`}
function updateSizeText(){$('#nameSizeValue').textContent=(+els.nameSize.value).toFixed(2)+' mm';$('#addressSizeValue').textContent=(+els.addressSize.value).toFixed(2)+' mm';$('#phoneSizeValue').textContent=(+els.phoneSize.value).toFixed(2)+' mm'}

function render(){applyTypeLayout();updateSizeText();const d=data(),c=cfg();els.grid.innerHTML=Array.from({length:c.cols*c.rows},()=>labelHTML(d)).join('');requestAnimationFrame(fitPreview)}

$('#clearBtn').addEventListener('click',()=>{els.name.value='';els.address.value='';els.phone.value='';render();setStatus('Đã xóa thông tin.');els.name.focus()});
$('#resetFontBtn').addEventListener('click',()=>{els.nameSize.value='2.62';els.addressSize.value='2.42';els.phoneSize.value='3.00';render();setStatus('Đã khôi phục cỡ chữ.')});
let previewZoom=1,panX=0,panY=0,spacePressed=false,isPanning=false,panStartX=0,panStartY=0,panBaseX=0,panBaseY=0;
function applyPan(){els.stage.style.setProperty('--pan-x',panX+'px');els.stage.style.setProperty('--pan-y',panY+'px')}
function resetPan(){panX=0;panY=0;applyPan()}
function fitPreview(){if(!els.stage||!els.shell)return;els.stage.style.setProperty('--scale','1');const sw=els.stage.offsetWidth||1,sh=els.stage.offsetHeight||1,aw=Math.max(1,els.shell.clientWidth-16),ah=Math.max(1,els.shell.clientHeight-16),base=Math.min(1,aw/sw,ah/sh),scale=Math.max(.18,Math.min(2.20,base*previewZoom));els.stage.style.setProperty('--scale',String(scale));applyPan()}
function typingTarget(t){return t&&((t.tagName==='INPUT')||(t.tagName==='TEXTAREA')||(t.tagName==='SELECT')||t.isContentEditable)}
window.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||typingTarget(e.target))return;spacePressed=true;els.shell.classList.add('pan-ready');e.preventDefault()});
window.addEventListener('keyup',e=>{if(e.code!=='Space')return;spacePressed=false;els.shell.classList.remove('pan-ready');if(!isPanning)els.shell.classList.remove('panning');e.preventDefault()});
window.addEventListener('blur',()=>{spacePressed=false;isPanning=false;els.shell.classList.remove('pan-ready','panning')});
els.shell.addEventListener('pointerdown',e=>{if(!spacePressed||e.button!==0)return;isPanning=true;panStartX=e.clientX;panStartY=e.clientY;panBaseX=panX;panBaseY=panY;els.shell.classList.add('panning');els.shell.setPointerCapture?.(e.pointerId);e.preventDefault()});
els.shell.addEventListener('pointermove',e=>{if(!isPanning)return;panX=panBaseX+(e.clientX-panStartX);panY=panBaseY+(e.clientY-panStartY);applyPan();e.preventDefault()});
function endPan(e){if(!isPanning)return;isPanning=false;els.shell.classList.remove('panning');if(spacePressed)els.shell.classList.add('pan-ready');try{els.shell.releasePointerCapture?.(e.pointerId)}catch(_){ }e.preventDefault()}
els.shell.addEventListener('pointerup',endPan);
els.shell.addEventListener('pointercancel',endPan);
els.shell.addEventListener('wheel',e=>{e.preventDefault();const r=els.stage.getBoundingClientRect();if(r.width>0&&r.height>0){const ox=Math.max(0,Math.min(100,((e.clientX-r.left)/r.width)*100)),oy=Math.max(0,Math.min(100,((e.clientY-r.top)/r.height)*100));els.stage.style.transformOrigin=`${ox}% ${oy}%`}previewZoom*=e.deltaY<0?1.12:0.89;previewZoom=Math.max(.55,Math.min(3.60,previewZoom));fitPreview()},{passive:false});
els.shell.addEventListener('dblclick',()=>{previewZoom=1;resetPan();els.stage.style.transformOrigin='center center';fitPreview()});
window.addEventListener('resize',fitPreview);
function waitImage(){const im=currentImg();return im.complete&&im.naturalWidth?Promise.resolve():new Promise((ok,fail)=>{im.onload=ok;im.onerror=fail})}
$('#printBtn').addEventListener('click',async()=>{try{setStatus('Đang mở cửa sổ in…');await waitImage();render();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));window.print();setTimeout(()=>setStatus(''),800)}catch(e){console.error(e);setStatus('Không thể mở bản in.')}});
function fitOneLine(ctx,text,maxWidth,start,min,weight='700'){let s=start;for(;s>min;s-=.5){ctx.font=`${weight} ${s}px "Times New Roman",serif`;if(ctx.measureText(text).width<=maxWidth)break}return Math.max(min,s)}
function wrapFit(ctx,text,maxWidth,maxLines,start,min,weight='700'){for(let s=start;s>=min;s-=.5){ctx.font=`${weight} ${s}px "Times New Roman",serif`;const words=text.split(/\s+/),lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(!line||ctx.measureText(t).width<=maxWidth)line=t;else{lines.push(line);line=w}}if(line)lines.push(line);if(lines.length<=maxLines)return{size:s,lines}}return{size:min,lines:[text]}}
function drawLabel(ctx,x,y,w,h,d,c,im){ctx.drawImage(im,x,y,w,h);const pxPerMm=w/c.w;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#000';if(d.name){const fs=fitOneLine(ctx,d.name,w-4*pxPerMm,d.sizes.name*pxPerMm,1.4*pxPerMm);ctx.font=`700 ${fs}px "Times New Roman",serif`;ctx.fillText(d.name,x+w/2,y+c.nameBase*pxPerMm)}if(d.address){const t='ĐỊA CHỈ: '+d.address,fit=wrapFit(ctx,t,w-4.6*pxPerMm,3,d.sizes.address*pxPerMm,1.4*pxPerMm);ctx.font=`700 ${fit.size}px "Times New Roman",serif`;const lh=fit.size*1.11;let baseMm;if(c.key==='cold'&&c.addressBottomBase){const lineStepMm=lh/pxPerMm;baseMm=c.addressBottomBase-(Math.min(3,fit.lines.length)-1)*lineStepMm}else{baseMm=fit.lines.length>=3?c.addressBase3:(fit.lines.length===2?c.addressBase2:c.addressBase1)}fit.lines.slice(0,3).forEach((ln,i)=>ctx.fillText(ln,x+w/2,y+baseMm*pxPerMm+i*lh))}if(d.phone){const t='SĐT : '+d.phone;ctx.fillStyle='#ef1111';const fs=fitOneLine(ctx,t,w-4*pxPerMm,d.sizes.phone*pxPerMm,1.8*pxPerMm,'400');ctx.font=`400 ${fs}px "Times New Roman",serif`;ctx.fillText(t,x+w/2,y+c.phoneBase*pxPerMm)}}
async function makeCanvas(){await waitImage();const c=cfg(),im=currentImg(),dpi=300,mm=dpi/25.4,W=Math.round(c.pageW*mm),H=Math.round(c.pageH*mm),lw=c.w*mm,lh=c.h*mm,gap=1*mm,can=document.createElement('canvas');can.width=W;can.height=H;const ctx=can.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const gw=c.cols*lw+(c.cols-1)*gap,gh=c.rows*lh+(c.rows-1)*gap,ox=(W-gw)/2,oy=(H-gh)/2,d=data();for(let r=0;r<c.rows;r++)for(let col=0;col<c.cols;col++)drawLabel(ctx,ox+col*(lw+gap),oy+r*(lh+gap),lw,lh,d,c,im);return can}
function txt(s){return new TextEncoder().encode(s)}
function buildPdf(jpeg,pw,ph){const c=cfg(),pageW=c.orientation==='landscape'?841.8898:595.2756,pageH=c.orientation==='landscape'?595.2756:841.8898,parts=[],off=[0];let len=0;const push=b=>{parts.push(b);len+=b.length};push(txt('%PDF-1.4\n'));function obj(n,chunks){off[n]=len;push(txt(`${n} 0 obj\n`));chunks.forEach(push);push(txt('\nendobj\n'))}obj(1,[txt('<< /Type /Catalog /Pages 2 0 R >>')]);obj(2,[txt('<< /Type /Pages /Kids [3 0 R] /Count 1 >>')]);obj(3,[txt(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`)]);obj(4,[txt(`<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`),jpeg,txt('\nendstream')]);const stream=txt(`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`);obj(5,[txt(`<< /Length ${stream.length} >>\nstream\n`),stream,txt('endstream')]);const xref=len;push(txt('xref\n0 6\n0000000000 65535 f \n'));for(let i=1;i<=5;i++)push(txt(String(off[i]).padStart(10,'0')+' 00000 n \n'));push(txt(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));return new Blob(parts,{type:'application/pdf'})}
function jpegBytes(c){return new Promise((ok,fail)=>c.toBlob(async b=>b?ok(new Uint8Array(await b.arrayBuffer())):fail(new Error('jpeg')),'image/jpeg',.98))}
$('#pdfBtn').addEventListener('click',async()=>{const b=$('#pdfBtn');try{b.disabled=true;setStatus('Đang tạo PDF…');const can=await makeCanvas(),jpg=await jpegBytes(can),pdf=buildPdf(jpg,can.width,can.height),u=URL.createObjectURL(pdf),a=document.createElement('a');a.href=u;a.download=currentType==='cold'?'nhan-lanh-2C-8C_A4_12-nhan.pdf':'nhan-ra-le-thuoc_A4_15-nhan.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);setStatus('Đã tạo PDF.')}catch(e){console.error(e);setStatus('Không tạo được PDF.')}finally{b.disabled=false}});

const APP_VERSION='2.3.2';
function standalone(){return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true}
function hideInstall(){els.install.hidden=true} function showInstall(){if(!standalone()&&!localStorage.getItem('nhan-install-action-done'))els.install.hidden=false}
function hideUpdate(){els.update.hidden=true} function showUpdate(){els.update.hidden=false}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstall()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;localStorage.setItem('nhan-install-action-done','1');hideInstall();setStatus('Đã cài đặt phần mềm.');setTimeout(()=>setStatus(''),1200)});
els.install.addEventListener('click',async()=>{localStorage.setItem('nhan-install-action-done','1');hideInstall();if(standalone()||!deferredPrompt)return;try{deferredPrompt.prompt();await deferredPrompt.userChoice}catch(e){console.error(e)}finally{deferredPrompt=null}});
function watchInstalling(reg){const worker=reg.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})}
async function registerServiceWorker(){hideUpdate();if(!('serviceWorker'in navigator)||!location.protocol.startsWith('http'))return;try{swRegistration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});if(swRegistration.waiting&&navigator.serviceWorker.controller)showUpdate();swRegistration.addEventListener('updatefound',()=>watchInstalling(swRegistration));await swRegistration.update();if(swRegistration.waiting&&navigator.serviceWorker.controller)showUpdate()}catch(e){console.error('Service worker:',e);hideUpdate()}}
navigator.serviceWorker?.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;hideUpdate();location.reload()});
els.update.addEventListener('click',async()=>{if(!swRegistration)return;let waiting=swRegistration.waiting;if(!waiting){try{await swRegistration.update()}catch(e){console.error(e)}waiting=swRegistration.waiting}if(waiting){hideUpdate();setStatus('Đang cập nhật…');waiting.postMessage({type:'SKIP_WAITING'})}else hideUpdate()});
hideInstall();hideUpdate();registerServiceWorker();render();fitPreview();
</script>
