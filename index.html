<style>
:root{--ink:#111827;--muted:#64748b;--line:#dbe3ea;--accent:#0f766e;--accent2:#115e59;--bg:#eef3f7}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea{font:inherit}.app{width:100vw;height:100vh;display:grid;grid-template-columns:350px minmax(0,1fr);overflow:hidden}.panel{height:100vh;overflow:hidden;background:#fff;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}.brand{display:flex;align-items:center;gap:10px;min-height:48px}.brand img{width:46px;height:46px;border-radius:12px;border:1px solid #cbd5e1;box-shadow:0 4px 14px rgba(15,118,110,.12)}.brand h1{font-size:18px;line-height:1.12;margin:0}.brand p{font-size:10.5px;color:var(--muted);margin:3px 0 0}.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;box-shadow:0 3px 10px rgba(15,23,42,.035)}.card h2{font-size:12.5px;margin:0 0 6px}.field{margin-top:6px}.field:first-of-type{margin-top:0}label{display:block;font-size:10.5px;font-weight:800;margin-bottom:3px}input[type=text],input[type=tel],textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#111827;outline:none;padding:6px 8px;font-size:12.5px}textarea{height:48px;resize:none;line-height:1.2}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.10)}.font-control{margin-top:4px;border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:4px 6px}.font-head{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:#475569;margin-bottom:1px}.font-head b{font-size:9.5px;color:#0f172a}.font-row{display:grid;grid-template-columns:28px 1fr 28px;gap:5px;align-items:center}.font-row input{width:100%;height:22px;margin:0;accent-color:var(--accent)}.mini{height:24px;padding:0;border-radius:6px;background:#fff;border:1px solid #cbd5e1;color:#111827;font-weight:800;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.btn{border:0;border-radius:8px;min-height:34px;padding:7px 8px;font-size:10.5px;font-weight:800;cursor:pointer;transition:.12s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.dark{background:#111827;color:#fff}.green{background:var(--accent);color:#fff}.soft{background:#e8f7f5;color:#0f766e;border:1px solid #b8e5de}.ghost{background:#f3f4f6;color:#111827;border:1px solid #e5e7eb}.status{min-height:14px;margin-top:5px;font-size:9.5px;line-height:1.25;color:var(--accent2)}.footer{margin-top:auto;padding:7px 8px;text-align:center;font-size:9.7px;line-height:1.35;border:1px solid var(--line);border-radius:10px;background:#fbfdfd}.footer a{color:#0f766e;text-decoration:none;font-weight:800}.workspace{height:100vh;min-width:0;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column}.workspace-head{height:28px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}.workspace-head b{font-size:12px}.workspace-head span{font-size:10px;color:var(--muted)}.preview-shell{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}.preview-stage{position:relative;width:297mm;height:210mm;flex:0 0 auto;transform:scale(var(--scale,1));transform-origin:center center}.a4{position:absolute;inset:0;width:297mm;height:210mm;background:#fff;display:grid;place-items:center;box-shadow:0 12px 34px rgba(15,23,42,.18)}.label-grid{display:grid;grid-template-columns:repeat(5,48mm);grid-template-rows:repeat(3,62mm);gap:1mm}.drug-label{position:relative;width:48mm;height:62mm;overflow:hidden;background:#fff;color:#000;font-family:"Times New Roman",Times,serif;--name-fs:2.62mm;--address-fs:2.42mm;--phone-fs:3mm}.template{position:absolute;inset:0;width:48mm;height:62mm;object-fit:fill;display:block;z-index:0;pointer-events:none}.head-name,.head-address,.head-phone{position:absolute;left:1.2mm;right:1.2mm;text-align:center;overflow:hidden;z-index:1}.head-name{top:.78mm;height:4.05mm;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--name-fs);line-height:1.03;text-transform:uppercase;white-space:nowrap}.head-address{top:5.32mm;height:8.55mm;display:flex;align-items:flex-start;justify-content:center;font-weight:700;font-size:var(--address-fs);line-height:1.11;text-transform:uppercase;padding:0 .3mm;white-space:normal;overflow-wrap:anywhere}.head-phone{top:14.38mm;height:3.3mm;display:flex;align-items:center;justify-content:center;color:#ef1111;font-size:var(--phone-fs);line-height:1;white-space:nowrap}
@media(max-height:760px) and (min-width:901px){.panel{padding:8px 10px;gap:5px}.brand{min-height:40px}.brand img{width:38px;height:38px}.brand h1{font-size:16px}.brand p{font-size:9.5px}.card{padding:7px 8px}.field{margin-top:4px}input[type=text],input[type=tel]{padding:5px 7px}textarea{height:40px}.font-control{margin-top:3px;padding:3px 5px}.actions{margin-top:5px;gap:4px}.btn{min-height:29px;padding:5px 6px;font-size:9.8px}.footer{padding:5px 7px;font-size:9px}.workspace{padding:8px 10px}.workspace-head{height:22px}}
@media(max-width:900px){html,body{height:auto;overflow:auto}.app{display:block;height:auto;overflow:visible}.panel{height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}.workspace{height:70vh;min-height:520px}.footer{margin-top:8px}}
@page{size:A4 landscape;margin:0}@media print{html,body{width:297mm;height:210mm;background:#fff!important;overflow:visible!important}.panel,.workspace-head{display:none!important}.app,.workspace,.preview-shell,.preview-stage{display:block!important;width:297mm!important;height:210mm!important;padding:0!important;margin:0!important;overflow:visible!important;transform:none!important}.a4{box-shadow:none!important}.template{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}
</style>

const $=s=>document.querySelector(s);
const els={name:$('#storeName'),address:$('#address'),phone:$('#phone'),nameSize:$('#nameSize'),addressSize:$('#addressSize'),phoneSize:$('#phoneSize'),grid:$('#labelGrid'),status:$('#status'),install:$('#installBtn'),update:$('#updateBtn'),stage:$('#previewStage'),shell:$('#previewShell')};
let deferredPrompt=null;
function setStatus(msg){els.status.textContent=msg||''}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
function data(){return{name:clean(els.name.value).toUpperCase(),address:clean(els.address.value).toUpperCase(),phone:clean(els.phone.value),sizes:{name:+els.nameSize.value,address:+els.addressSize.value,phone:+els.phoneSize.value}}}
function labelHTML(d){const n=esc(d.name),a=d.address?esc('ĐỊA CHỈ: '+d.address):'',p=d.phone?esc('SĐT : '+d.phone):'';return `<div class="drug-label" style="--name-fs:${d.sizes.name}mm;--address-fs:${d.sizes.address}mm;--phone-fs:${d.sizes.phone}mm"><img class="template" src="${TEMPLATE}" alt=""><div class="head-name">${n}</div><div class="head-address">${a}</div><div class="head-phone">${p}</div></div>`}
function updateSizeText(){$('#nameSizeValue').textContent=(+els.nameSize.value).toFixed(2)+' mm';$('#addressSizeValue').textContent=(+els.addressSize.value).toFixed(2)+' mm';$('#phoneSizeValue').textContent=(+els.phoneSize.value).toFixed(2)+' mm'}
function render(){updateSizeText();const d=data();els.grid.innerHTML=Array.from({length:15},()=>labelHTML(d)).join('');requestAnimationFrame(fitPreview)}
[els.name,els.address,els.phone,els.nameSize,els.addressSize,els.phoneSize].forEach(x=>x.addEventListener('input',render));
document.querySelectorAll('.mini').forEach(b=>b.addEventListener('click',()=>{const x=$('#'+b.dataset.target),v=Math.min(+x.max,Math.max(+x.min,+x.value+(+b.dataset.step)));x.value=v.toFixed(2);x.dispatchEvent(new Event('input',{bubbles:true}))}));
$('#clearBtn').addEventListener('click',()=>{els.name.value='';els.address.value='';els.phone.value='';render();setStatus('Đã xóa thông tin.');els.name.focus()});
$('#resetFontBtn').addEventListener('click',()=>{els.nameSize.value='2.62';els.addressSize.value='2.42';els.phoneSize.value='3.00';render();setStatus('Đã khôi phục cỡ chữ.')});
function fitPreview(){if(!els.stage||!els.shell)return;els.stage.style.setProperty('--scale','1');const sw=els.stage.offsetWidth||1123,sh=els.stage.offsetHeight||794,aw=Math.max(1,els.shell.clientWidth-16),ah=Math.max(1,els.shell.clientHeight-16),scale=Math.min(1,aw/sw,ah/sh);els.stage.style.setProperty('--scale',String(Math.max(.22,scale)))}
window.addEventListener('resize',fitPreview);

const img=new Image();img.src=TEMPLATE;
function waitImage(){return img.complete&&img.naturalWidth?Promise.resolve():new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail})}
$('#printBtn').addEventListener('click',async()=>{try{setStatus('Đang mở cửa sổ in…');await waitImage();render();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));window.print();setTimeout(()=>setStatus(''),800)}catch(e){console.error(e);setStatus('Không thể mở bản in.') }});

function fitOneLine(ctx,text,maxWidth,start,min,weight='700'){let s=start;for(;s>min;s-=.5){ctx.font=`${weight} ${s}px "Times New Roman",serif`;if(ctx.measureText(text).width<=maxWidth)break}return Math.max(min,s)}
function wrapFit(ctx,text,maxWidth,maxLines,start,min,weight='700'){for(let s=start;s>=min;s-=.5){ctx.font=`${weight} ${s}px "Times New Roman",serif`;const words=text.split(/\s+/),lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(!line||ctx.measureText(t).width<=maxWidth)line=t;else{lines.push(line);line=w}}if(line)lines.push(line);if(lines.length<=maxLines)return{size:s,lines}}return{size:min,lines:[text]}}
function drawLabel(ctx,x,y,w,h,d){ctx.drawImage(img,x,y,w,h);const sx=w/624,sy=h/798,s=(sx+sy)/2,px=w/48;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#000';if(d.name){const fs=fitOneLine(ctx,d.name,w-30*s,d.sizes.name*px,14*sy);ctx.font=`700 ${fs}px "Times New Roman",serif`;ctx.fillText(d.name,x+w/2,y+49*sy)}if(d.address){const t='ĐỊA CHỈ: '+d.address,fit=wrapFit(ctx,t,w-64*s,3,d.sizes.address*px,13*sy);ctx.font=`700 ${fit.size}px "Times New Roman",serif`;const lh=fit.size*1.11;let base=y+97*sy;if(fit.lines.length===2)base=y+112*sy;if(fit.lines.length===1)base=y+132*sy;fit.lines.slice(0,3).forEach((ln,i)=>ctx.fillText(ln,x+w/2,base+i*lh))}if(d.phone){const t='SĐT : '+d.phone;ctx.fillStyle='#ef1111';const fs=fitOneLine(ctx,t,w-50*s,d.sizes.phone*px,16*sy,'400');ctx.font=`400 ${fs}px "Times New Roman",serif`;ctx.fillText(t,x+w/2,y+220*sy)}}
async function makeCanvas(){await waitImage();const dpi=300,mm=dpi/25.4,W=Math.round(297*mm),H=Math.round(210*mm),lw=48*mm,lh=62*mm,gap=1*mm,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const gw=5*lw+4*gap,gh=3*lh+2*gap,ox=(W-gw)/2,oy=(H-gh)/2,d=data();for(let r=0;r<3;r++)for(let col=0;col<5;col++)drawLabel(ctx,ox+col*(lw+gap),oy+r*(lh+gap),lw,lh,d);return c}
function txt(s){return new TextEncoder().encode(s)}
function buildPdf(jpeg,pw,ph){const pageW=841.8898,pageH=595.2756,parts=[],off=[0];let len=0;const push=b=>{parts.push(b);len+=b.length};push(txt('%PDF-1.4\n'));function obj(n,chunks){off[n]=len;push(txt(`${n} 0 obj\n`));chunks.forEach(push);push(txt('\nendobj\n'))}obj(1,[txt('<< /Type /Catalog /Pages 2 0 R >>')]);obj(2,[txt('<< /Type /Pages /Kids [3 0 R] /Count 1 >>')]);obj(3,[txt(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`)]);obj(4,[txt(`<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`),jpeg,txt('\nendstream')]);const stream=txt(`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`);obj(5,[txt(`<< /Length ${stream.length} >>\nstream\n`),stream,txt('endstream')]);const xref=len;push(txt('xref\n0 6\n0000000000 65535 f \n'));for(let i=1;i<=5;i++)push(txt(String(off[i]).padStart(10,'0')+' 00000 n \n'));push(txt(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));return new Blob(parts,{type:'application/pdf'})}
function jpegBytes(c){return new Promise((ok,fail)=>c.toBlob(async b=>b?ok(new Uint8Array(await b.arrayBuffer())):fail(new Error('jpeg')),'image/jpeg',.98))}
$('#pdfBtn').addEventListener('click',async()=>{const b=$('#pdfBtn');try{b.disabled=true;setStatus('Đang tạo PDF…');const c=await makeCanvas(),jpg=await jpegBytes(c),pdf=buildPdf(jpg,c.width,c.height),u=URL.createObjectURL(pdf),a=document.createElement('a');a.href=u;a.download='nhan-ra-le-thuoc_A4_15-nhan.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);setStatus('Đã tạo PDF.')}catch(e){console.error(e);setStatus('Không tạo được PDF.')}finally{b.disabled=false}});

function initManifest(){try{const m={name:'Phần mềm in nhãn ra lẻ thuốc',short_name:'Nhãn ra lẻ',description:'Phần mềm nội bộ in nhãn ra lẻ thuốc',start_url:'./',display:'standalone',background_color:'#eef3f7',theme_color:'#0f766e',icons:[{src:ICON192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};const blob=new Blob([JSON.stringify(m)],{type:'application/manifest+json'}),link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link)}catch(e){console.warn(e)}}
initManifest();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;els.install.disabled=false});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;setStatus('Đã cài đặt phần mềm.')});
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function makeShortcut(){try{const target=location.href.split('?')[0].split('#')[0];const body='[InternetShortcut]\r\nURL='+target+'\r\n';const blob=new Blob([body],{type:'application/internet-shortcut'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='In nhan ra le thuoc.url';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);setStatus('Đã tạo file lối tắt.')}catch(e){setStatus('Không tạo được lối tắt.')}}
els.install.addEventListener('click',async()=>{if(standalone()){setStatus('Phần mềm đã được cài đặt.');return}if(deferredPrompt){deferredPrompt.prompt();const c=await deferredPrompt.userChoice;setStatus(c.outcome==='accepted'?'Đã cài đặt phần mềm.':'Đã đóng cài đặt.');deferredPrompt=null;return}if(location.protocol==='file:'){makeShortcut();return}setStatus('Mở menu trình duyệt để cài ứng dụng.')});
els.update.addEventListener('click',()=>{setStatus('Đang cập nhật…');setTimeout(()=>{if(location.protocol==='file:'){location.reload()}else{const u=new URL(location.href);u.searchParams.set('_v',Date.now());location.replace(u.toString())}},150)});
render();fitPreview();
